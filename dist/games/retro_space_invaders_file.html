<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retro Space Invaders (Improved)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      background: black;
      color: #39ff14;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }

    canvas {
      background: #000;
      display: block;
      border: 2px solid #39ff14;
      image-rendering: pixelated;
    }

    #hud {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: #39ff14;
      font-size: 12px;
    }

    #startBtn,
    #resetBtn {
      background: #000;
      border: 1px solid #39ff14;
      color: #39ff14;
      padding: 8px 16px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      margin: 5px;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="hud">
    Score: <span id="score">0</span> &nbsp;&nbsp; Lives: <span id="lives">5</span> &nbsp;&nbsp; High Score: <span
      id="highScore">0</span>
    <br />
    <button id="startBtn">Start</button><button id="resetBtn">Reset</button>
  </div>
  <canvas id="game" width="600" height="480"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const highScoreEl = document.getElementById('highScore');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');

      const W = canvas.width;
      const H = canvas.height;

      // Game state
      let score = 0;
      let lives = 5;
      let highScore = parseInt(localStorage.getItem('spaceInvadersHigh') || '0', 10);
      highScoreEl.textContent = highScore;

      let gameRunning = false;
      let isPlayerDead = false;

      // Player ship
      const player = {
        width: 30,
        height: 15,
        x: W / 2 - 15,
        y: H - 40,
        speed: 6,
        movingLeft: false,
        movingRight: false,
        bullets: [],
        canShoot: true,
      };

      // Aliens
      const alienRows = 5;
      const alienCols = 11;
      const alienWidth = 26;
      const alienHeight = 18;
      const alienPadding = 8;
      const alienOffsetTop = 50;
      const alienOffsetLeft = 40;
      const aliens = [];
      let alienDirection = 1; // 1: right, -1: left
      let alienSpeed = 0.8;
      let alienStepDown = 20;
      let alienMoveCounter = 0;
      const alienMoveInterval = 30;

      // Alien bullets
      const alienBullets = [];

      // Create aliens grid
      function createAliens() {
        aliens.length = 0;
        for (let r = 0; r < alienRows; r++) {
          for (let c = 0; c < alienCols; c++) {
            aliens.push({
              x: alienOffsetLeft + c * (alienWidth + alienPadding),
              y: alienOffsetTop + r * (alienHeight + alienPadding),
              width: alienWidth,
              height: alienHeight,
              alive: true,
            });
          }
        }
      }

      // Draw player ship
      function drawPlayer() {
        if (isPlayerDead) return;
        ctx.fillStyle = '#39ff14';
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.closePath();
        ctx.fill();
      }

      // Draw aliens
      function drawAliens() {
        ctx.fillStyle = '#39ff14';
        aliens.forEach(alien => {
          if (alien.alive) {
            ctx.fillRect(alien.x, alien.y, alien.width, alien.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(alien.x + 6, alien.y + 6, 4, 4);
            ctx.fillRect(alien.x + 16, alien.y + 6, 4, 4);
            ctx.fillStyle = '#39ff14';
          }
        });
      }

      // Draw bullets
      function drawBullets() {
        ctx.fillStyle = '#39ff14';
        player.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
        ctx.fillStyle = '#ff3f3f';
        alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
      }

      // Update player position
      function updatePlayer() {
        if (isPlayerDead) return;
        if (player.movingLeft) {
          player.x -= player.speed;
          if (player.x < 0) player.x = 0;
        }
        if (player.movingRight) {
          player.x += player.speed;
          if (player.x + player.width > W) player.x = W - player.width;
        }
      }

      // Update bullets
      function updateBullets() {
        player.bullets.forEach((b, i) => {
          b.y -= b.speed;
          if (b.y + b.height < 0) {
            player.bullets.splice(i, 1);
          }
        });
        alienBullets.forEach((b, i) => {
          b.y += b.speed;
          if (b.y > H) {
            alienBullets.splice(i, 1);
          }
        });
      }

      // Update aliens
      function updateAliens() {
        alienMoveCounter++;
        if (alienMoveCounter >= alienMoveInterval) {
          let edgeReached = false;
          for (let alien of aliens) {
            if (!alien.alive) continue;
            if (alienDirection === 1 && alien.x + alien.width + alienSpeed > W) {
              edgeReached = true;
              break;
            } else if (alienDirection === -1 && alien.x - alienSpeed < 0) {
              edgeReached = true;
              break;
            }
          }
          if (edgeReached) {
            alienDirection *= -1;
            aliens.forEach(alien => {
              if (alien.alive) {
                alien.y += alienStepDown;
                if (alien.y + alien.height > player.y) {
                  gameOver();
                }
              }
            });
          } else {
            aliens.forEach(alien => {
              if (alien.alive) alien.x += alienSpeed * alienDirection;
            });
          }
          alienMoveCounter = 0;
        }
      }

      // Alien shooting
      function alienShoot() {
        let shooters = [];
        for (let c = 0; c < alienCols; c++) {
          for (let r = alienRows - 1; r >= 0; r--) {
            const idx = r * alienCols + c;
            if (aliens[idx] && aliens[idx].alive) {
              shooters.push(aliens[idx]);
              break;
            }
          }
        }
        if (shooters.length > 0 && Math.random() < 0.03) {
          const shooter = shooters[Math.floor(Math.random() * shooters.length)];
          alienBullets.push({
            x: shooter.x + shooter.width / 2 - 2,
            y: shooter.y + shooter.height,
            speed: 4,
            width: 4,
            height: 10
          });
        }
      }

      // Collision detection helpers
      function rectIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.width ||
          r2.x + r2.width < r1.x ||
          r2.y > r1.y + r1.height ||
          r2.y + r2.height < r1.y);
      }

      // Check collisions
      function checkCollisions() {
        // Player bullets vs aliens
        player.bullets.forEach((b, bi) => {
          aliens.forEach((alien, ai) => {
            if (alien.alive && rectIntersect(b, alien)) {
              alien.alive = false;
              player.bullets.splice(bi, 1);
              score += 10;
              if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceInvadersHigh', highScore);
                highScoreEl.textContent = highScore;
              }
            }
          });
        });

        // Alien bullets vs player
        if (!isPlayerDead) {
          for (let i = alienBullets.length - 1; i >= 0; i--) {
            const b = alienBullets[i];
            const playerRect = { x: player.x, y: player.y, width: player.width, height: player.height };
            if (rectIntersect(b, playerRect)) {
              alienBullets.splice(i, 1);
              lives--;
              isPlayerDead = true;
              updateHUD();
              if (lives <= 0) {
                gameOver();
              } else {
                // Respawn delay of 1.5 seconds
                setTimeout(() => {
                  isPlayerDead = false;
                  player.x = W / 2 - player.width / 2;
                }, 1500);
              }
              break; // One bullet hit at a time
            }
          }
        }
      }

      // Game over
      function gameOver() {
        gameRunning = false;
        alert('GAME OVER! Your score: ' + score);
      }

      // Reset game
      function resetGame() {
        score = 0;
        lives = 5;
        isPlayerDead = false;
        player.x = W / 2 - player.width / 2;
        player.bullets = [];
        alienBullets.length = 0;
        createAliens();
        alienDirection = 1;
        alienSpeed = 0.8;
        gameRunning = false;
        updateHUD();
      }

      // Update HUD
      function updateHUD() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        highScoreEl.textContent = highScore;
      }

      // Game loop
      function loop() {
        if (!gameRunning) return;
        updatePlayer();
        updateBullets();
        updateAliens();
        alienShoot();
        checkCollisions();

        ctx.clearRect(0, 0, W, H);
        drawPlayer();
        drawAliens();
        drawBullets();
        updateHUD();

        if (aliens.every(a => !a.alive)) {
          alert('YOU WIN! Score: ' + score);
          resetGame();
        }

        requestAnimationFrame(loop);
      }

      // Player shoot
      function shoot() {
        if (!gameRunning || isPlayerDead) return;
        if (player.canShoot) {
          player.bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y - 10,
            speed: 7,
            width: 4,
            height: 10
          });
          player.canShoot = false;
          setTimeout(() => { player.canShoot = true; }, 300);
        }
      }

      // Input handlers
      window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft') player.movingLeft = true;
        else if (e.code === 'ArrowRight') player.movingRight = true;
        else if (e.code === 'Space') shoot();
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft') player.movingLeft = false;
        else if (e.code === 'ArrowRight') player.movingRight = false;
      });

      // Buttons
      startBtn.onclick = () => {
        if (!gameRunning) {
          gameRunning = true;
          loop();
        }
      };

      resetBtn.onclick = () => {
        resetGame();
      };

      // Initialize
      resetGame();
    })();
  </script>
</body>

</html>
